<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAdvisor AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* Custom styles for the markdown output */
        #output-content h1, #output-content h2, #output-content h3 { font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #1f2937; }
        #output-content h1 { font-size: 1.5rem; } #output-content h2 { font-size: 1.25rem; }
        #output-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        #output-content p { margin-bottom: 1rem; line-height: 1.6; }
        #output-content strong { color: #111827; }
        
        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff;
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-4xl font-extrabold text-blue-900 mb-2">🔐 CyberAdvisor AI</h1>
            <p class="text-lg text-gray-600">Your intelligent cybersecurity architect. Tell us what you're building, and we'll tell you how to secure it.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">1. System Details & Config</h2>
                
                <div class="mb-6 bg-gray-50 p-4 rounded border border-gray-300">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="api-url">Local LLM API Endpoint (OpenAI Compatible):</label>
                    <input type="text" id="api-url" value="http://localhost:1234/v1/chat/completions" 
                        class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"
                        placeholder="e.g., http://localhost:1234/v1/chat/completions">
                    <p class="text-xs text-gray-500 mt-1">Default is for LM Studio. Use http://localhost:11434/v1/chat/completions for Ollama.</p>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="project-type">Project Type:</label>
                    <select id="project-type" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="Web Application">Web Application</option>
                        <option value="Mobile App">Mobile App</option>
                        <option value="Cloud Infrastructure">Cloud Infrastructure</option>
                        <option value="Internal Network">Internal Network</option>
                        <option value="IoT System">IoT System</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="tech-stack">Tech Stack / System Setup:</label>
                    <textarea id="tech-stack" rows="4" 
                        class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                        placeholder="E.g., React frontend, Python Django backend, AWS PostgreSQL database..."></textarea>
                </div>

                <button id="generate-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200 flex justify-center items-center gap-2">
                    <span>Generate Security Checklist</span>
                    <div id="btn-spinner" class="spinner"></div>
                </button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 flex flex-col h-full">
                <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">2. Security Recommendations</h2>
                
                <div id="output-box" class="flex-grow bg-gray-50 border border-gray-200 rounded p-4 overflow-y-auto min-h-[300px]">
                    <div id="output-content" class="text-gray-600 italic">
                        Awaiting system details...
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const projectType = document.getElementById('project-type').value;
            const techStack = document.getElementById('tech-stack').value.trim();
            const apiUrl = document.getElementById('api-url').value.trim();
            const outputContent = document.getElementById('output-content');
            const btnSpinner = document.getElementById('btn-spinner');
            const generateBtn = document.getElementById('generate-btn');

            if (!techStack) {
                alert("Please enter your Tech Stack or System Setup.");
                return;
            }

            // Update UI for loading state
            outputContent.innerHTML = "<em>Analyzing your architecture and generating security plan...</em>";
            outputContent.classList.remove('italic', 'text-gray-600');
            btnSpinner.style.display = 'block';
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // Construct the prompt
            const systemPrompt = "You are an expert Cybersecurity Architect. Your job is to review the user's project and provide a structured, prioritized cybersecurity checklist. Format your response strictly in Markdown using headers, bullet points, and bold text for readability. Do not include introductory fluff; get straight to the technical advice.";
            const userMessage = `I am building a ${projectType}. The tech stack and system details are: ${techStack}. Please provide a comprehensive security checklist tailored to these specific technologies.`;

            // Prepare the payload for an OpenAI-compatible API
            const payload = {
                model: "local-model", // Most local servers ignore this field, but some require it
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: userMessage }
                ],
                temperature: 0.7,
                max_tokens: 1000
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Add an Authorization header here if your local server requires an API key
                        // 'Authorization': 'Bearer YOUR_KEY' 
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }

                const data = await response.json();
                
                // Extract the text from the OpenAI-compatible response format
                const aiResponseText = data.choices[0].message.content;

                // Render the Markdown to HTML using marked.js
                outputContent.innerHTML = marked.parse(aiResponseText);

            } catch (error) {
                console.error("Error connecting to local LLM:", error);
                outputContent.innerHTML = `
                    <div class="text-red-600">
                        <strong>⚠️ Connection Error:</strong> Could not connect to the local LLM at <code>${apiUrl}</code>.<br><br>
                        <strong>Troubleshooting:</strong>
                        <ul class="list-disc ml-6 mt-2">
                            <li>Is your local LLM server (LM Studio, Ollama, etc.) currently running?</li>
                            <li>Is the local server configured to accept Cross-Origin Resource Sharing (CORS)?</li>
                            <li>If this page is hosted on GitHub Pages (https), your browser is blocking the request to localhost (http). You must run this HTML file locally on your machine.</li>
                        </ul>
                    </div>`;
            } finally {
                // Reset UI
                btnSpinner.style.display = 'none';
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
