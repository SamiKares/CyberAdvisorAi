<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turvabotti Disc Golf Records</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #4caf50;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Tabs styling for mobile tapping */
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 8px;
            margin: 20px 0;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* Content Sections */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Record Cards */
        .course-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .course-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .layout-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #333;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .record-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }

        .score {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .player-info {
            text-align: right;
        }

        .player-name {
            font-weight: 500;
        }

        .date-disc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>🥏 Course Records</h1>
        <div class="subtitle">turvabotti.com/discgolf</div>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'full-bag')">Full Bag</button>
        <button class="tab-btn" onclick="switchTab(event, 'one-disc')">1-Disc</button>
        <button class="tab-btn" onclick="switchTab(event, 'doubles')">Doubles</button>
    </div>

    <!-- FULL BAG CONTENT -->
    <div id="full-bag" class="tab-content active">
        <!-- Course 1 -->
        <div class="course-card">
            <div class="course-header">
                <span class="course-name">Äijänniemi DGC</span>
                <span class="layout-info">Main 18</span>
            </div>
            <div class="record-row">
                <div class="score">-7 (51)</div>
                <div class="player-info">
                    <div class="player-name">Matti</div>
                    <div class="date-disc">May 2026</div>
                </div>
            </div>
        </div>
        
        <!-- Course 2 -->
        <div class="course-card">
            <div class="course-header">
                <span class="course-name">Kippasuo Pro</span>
                <span class="layout-info">A-Tier</span>
            </div>
            <div class="record-row">
                <div class="score">+2 (60)</div>
                <div class="player-info">
                    <div class="player-name">Pekka</div>
                    <div class="date-disc">April 2026</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ONE DISC CHALLENGE CONTENT -->
    <div id="one-disc" class="tab-content">
        <div class="course-card">
            <div class="course-header">
                <span class="course-name">Äijänniemi DGC</span>
                <span class="layout-info">Main 18</span>
            </div>
            <div class="record-row">
                <div class="score">E (58)</div>
                <div class="player-info">
                    <div class="player-name">Matti</div>
                    <div class="date-disc">Buzzz (Z-Line)</div>
                </div>
            </div>
        </div>
    </div>

    <!-- DOUBLES CONTENT -->
    <div id="doubles" class="tab-content">
        <div class="course-card">
            <div class="course-header">
                <span class="course-name">Äijänniemi DGC</span>
                <span class="layout-info">Best Shot</span>
            </div>
            <div class="record-row">
                <div class="score">-11 (47)</div>
                <div class="player-info">
                    <div class="player-name">Matti & Pekka</div>
                    <div class="date-disc">May 2026</div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript to make tabs switch -->
    <script>
        function switchTab(event, tabId) {
            // Hide all contents
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            // Deactivate all buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Show current tab & activate button
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
