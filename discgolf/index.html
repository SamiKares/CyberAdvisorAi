<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisbee PDGA All Time Greatest Rounds Played</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070a0f;
            --bg-surface: #0d1117;
            --bg-card: #111820;
            --bg-elevated: #192030;
            --accent: #f5c518;
            --accent-dim: rgba(245, 197, 24, 0.12);
            --accent-glow: rgba(245, 197, 24, 0.25);
            --text-main: #eef2f7;
            --text-muted: #5a6a80;
            --text-mid: #8899aa;
            --border: rgba(255,255,255,0.06);
            --border-accent: rgba(245,197,24,0.3);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Background texture ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245,197,24,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(20,80,160,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Disc watermark ── */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            border-radius: 50%;
            border: 1px solid rgba(245,197,24,0.03);
            box-shadow:
                0 0 0 60px rgba(245,197,24,0.015),
                0 0 0 120px rgba(245,197,24,0.01),
                0 0 0 200px rgba(245,197,24,0.006);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* ── Header ── */
        header {
            padding: 52px 0 40px;
            position: relative;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .eyebrow::before, .eyebrow::after {
            content: '';
            display: block;
            width: 24px;
            height: 1px;
            background: var(--accent);
            opacity: 0.6;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.4rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            line-height: 0.95;
            margin: 0 0 20px;
            color: var(--text-main);
        }

        h1 span {
            color: var(--accent);
            display: block;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.05em;
        }

        .header-meta .sep {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.4;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, var(--accent) 0%, rgba(245,197,24,0.1) 40%, transparent 100%);
            margin-bottom: 28px;
        }

        /* ── Tabs ── */
        .tabs-wrapper {
            margin-bottom: 32px;
        }

        .tabs {
            display: inline-flex;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px;
            gap: 2px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 9px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-mid);
            background: rgba(255,255,255,0.03);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #070a0f;
        }

        /* ── Content ── */
        .tab-content { display: none; }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: rise 0.28s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Course Card ── */
        .course-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .course-card:hover {
            border-color: rgba(245,197,24,0.15);
        }

        .course-card-header {
            padding: 16px 20px 14px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .course-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.07em;
            color: var(--text-main);
            line-height: 1;
        }

        .layout-badge {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--border-accent);
            padding: 3px 10px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Leaderboard ── */
        .leaderboard {
            padding: 4px 0;
        }

        .record-row {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 11px 20px;
            transition: background 0.15s;
        }

        .record-row:hover {
            background: rgba(255,255,255,0.02);
        }

        .record-row + .record-row {
            border-top: 1px solid var(--border);
        }

        /* Gold / silver / bronze for top 3 */
        .record-row:nth-child(1) .rank-num { color: var(--accent); }
        .record-row:nth-child(2) .rank-num { color: #b0b8c4; }
        .record-row:nth-child(3) .rank-num { color: #c88040; }

        .rank-col {
            text-align: center;
        }

        .rank-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.0rem;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            line-height: 1;
        }

        .score {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.04em;
            color: var(--text-main);
            line-height: 1;
        }

        .record-row:nth-child(1) .score {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .player-col {
            text-align: right;
        }

        .player-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.2;
        }

        .detail-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.02em;
        }

        /* ── Empty & Error ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        #error-msg {
            display: none;
            background: rgba(220,40,40,0.08);
            border: 1px solid rgba(220,40,40,0.2);
            border-radius: 8px;
            padding: 16px 20px;
            color: #f07070;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* ── Footer ── */
        footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="eyebrow">PDGA · Official Records</div>
        <h1>All Time Greatest<span>Rounds Played</span></h1>
        <div class="header-meta">
            <span>Disc Golf</span>
            <span class="sep"></span>
            <span>Course Records Archive</span>
            <span class="sep"></span>
            <span id="record-count">—</span>
        </div>
    </header>

    <div class="divider"></div>

    <div id="error-msg">⚠ Cannot load records.json — check for formatting errors (missing quotes, trailing commas).</div>

    <div class="tabs-wrapper">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('full-bag', this)">Full Bag</button>
            <button class="tab-btn" onclick="switchTab('one-disc', this)">1-Disc</button>
            <button class="tab-btn" onclick="switchTab('doubles', this)">Doubles</button>
        </div>
    </div>

    <div id="full-bag" class="tab-content active"></div>
    <div id="one-disc" class="tab-content"></div>
    <div id="doubles" class="tab-content"></div>

    <footer>Frisbee PDGA · Records Archive</footer>

</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function buildHTML(dataArray) {
        if (!dataArray || dataArray.length === 0)
            return '<div class="empty-state">No records yet.</div>';

        return dataArray.map(course => `
            <div class="course-card">
                <div class="course-card-header">
                    <div class="course-name">${course.course}</div>
                    <div class="layout-badge">${course.layout}</div>
                </div>
                <div class="leaderboard">
                    ${course.records.map((record, i) => `
                        <div class="record-row">
                            <div class="rank-col">
                                <div class="rank-num">#${i + 1}</div>
                            </div>
                            <div class="score">${record.score}</div>
                            <div class="player-col">
                                <div class="player-name">${record.player}</div>
                                ${record.detail ? `<div class="detail-text">${record.detail}</div>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    async function loadRecords() {
        try {
            const response = await fetch('records.json?v=' + Date.now());
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();

            document.getElementById('full-bag').innerHTML = buildHTML(data.fullBag);
            document.getElementById('one-disc').innerHTML = buildHTML(data.oneDisc);
            document.getElementById('doubles').innerHTML = buildHTML(data.doubles);

            const total = [data.fullBag, data.oneDisc, data.doubles]
                .flat()
                .reduce((s, c) => s + (c?.records?.length || 0), 0);
            document.getElementById('record-count').textContent = total + ' records';

        } catch (err) {
            console.error('Error loading JSON:', err);
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    loadRecords();
</script>
</body>
</html>
