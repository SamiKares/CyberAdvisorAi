<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frisbee PDGA All Time Greatest Rounds Played</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070a0f;
            --bg-surface: #0d1117;
            --bg-card: #111820;
            --bg-elevated: #192030;
            --accent: #f5c518;
            --accent-dim: rgba(245, 197, 24, 0.12);
            --accent-glow: rgba(245, 197, 24, 0.25);
            --text-main: #eef2f7;
            --text-muted: #5a6a80;
            --text-mid: #8899aa;
            --border: rgba(255,255,255,0.06);
            --border-accent: rgba(245,197,24,0.3);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245,197,24,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(20,80,160,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            border-radius: 50%;
            border: 1px solid rgba(245,197,24,0.03);
            box-shadow:
                0 0 0 60px rgba(245,197,24,0.015),
                0 0 0 120px rgba(245,197,24,0.01),
                0 0 0 200px rgba(245,197,24,0.006);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 20px 60px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 28px 60px;
            }
        }

        /* ── Header ── */
        header {
            padding: 52px 0 40px;
            position: relative;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .eyebrow::before, .eyebrow::after {
            content: '';
            display: block;
            width: 24px;
            height: 1px;
            background: var(--accent);
            opacity: 0.6;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.4rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            line-height: 0.95;
            margin: 0 0 20px;
            color: var(--text-main);
        }

        h1 span {
            color: var(--accent);
            display: block;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.05em;
        }

        .header-meta .sep {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.4;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, var(--accent) 0%, rgba(245,197,24,0.1) 40%, transparent 100%);
            margin-bottom: 28px;
        }

        /* ── Controls row ── */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        /* ── Tabs ── */
        .tabs {
            display: inline-flex;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px;
            gap: 2px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 9px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.18s ease;
            white-space: nowrap;
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-mid);
            background: rgba(255,255,255,0.03);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #070a0f;
        }

        /* ── Player Filter Dropdown ── */
        .filter-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .filter-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .filter-select-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 9px 14px;
            color: var(--text-mid);
            font-size: 0.8rem;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
            min-width: 160px;
            justify-content: space-between;
        }

        .filter-select-btn:hover,
        .filter-select-btn.open {
            border-color: var(--border-accent);
            color: var(--text-main);
        }

        .filter-select-btn.has-filter {
            border-color: var(--border-accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .filter-select-btn svg {
            flex-shrink: 0;
            transition: transform 0.18s ease;
        }

        .filter-select-btn.open svg {
            transform: rotate(180deg);
        }

        .filter-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 200px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-accent);
            border-radius: 8px;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            display: none;
            animation: dropIn 0.16s cubic-bezier(0.16,1,0.3,1);
        }

        .filter-dropdown.open {
            display: block;
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .filter-option {
            padding: 10px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-mid);
            cursor: pointer;
            transition: all 0.12s ease;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.02em;
        }

        .filter-option:last-child {
            border-bottom: none;
        }

        .filter-option:hover {
            background: rgba(255,255,255,0.04);
            color: var(--text-main);
        }

        .filter-option.selected {
            color: var(--accent);
            background: var(--accent-dim);
        }

        .filter-option.all-option {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .filter-option.all-option.selected {
            color: var(--accent);
        }

        /* ── Player filter banner ── */
        .filter-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--accent-dim);
            border: 1px solid var(--border-accent);
            border-radius: 6px;
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--accent);
        }

        .filter-banner.visible {
            display: flex;
        }

        .filter-banner-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clear-filter-btn {
            background: none;
            border: 1px solid var(--border-accent);
            border-radius: 4px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'DM Sans', sans-serif;
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .clear-filter-btn:hover {
            background: var(--accent);
            color: #070a0f;
        }

        /* ── Content ── */
        .tab-content { display: none; }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: rise 0.28s cubic-bezier(0.16,1,0.3,1);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Course Card ── */
        .course-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .course-card:hover {
            border-color: rgba(245,197,24,0.15);
        }

        .course-card-header {
            padding: 16px 20px 14px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .course-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.07em;
            color: var(--text-main);
            line-height: 1;
        }

        .layout-badge {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            border: 1px solid var(--border-accent);
            padding: 3px 10px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Leaderboard ── */
        .leaderboard {
            padding: 4px 0;
        }

        .record-row {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 11px 20px;
            transition: background 0.15s;
        }

        .record-row.highlight-row {
            background: rgba(245,197,24,0.04);
        }

        .record-row:hover {
            background: rgba(255,255,255,0.02);
        }

        .record-row + .record-row {
            border-top: 1px solid var(--border);
        }

        .record-row:nth-child(1) .rank-num { color: var(--accent); }
        .record-row:nth-child(2) .rank-num { color: #b0b8c4; }
        .record-row:nth-child(3) .rank-num { color: #c88040; }

        .rank-col {
            text-align: center;
        }

        .rank-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.0rem;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            line-height: 1;
        }

        .score {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.04em;
            color: var(--text-main);
            line-height: 1;
        }

        .record-row:nth-child(1) .score {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .player-col {
            text-align: right;
        }

        .player-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.2;
        }

        .player-name.matched {
            color: var(--accent);
        }

        .detail-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.02em;
        }

        /* ── Empty & Error ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        #error-msg {
            display: none;
            background: rgba(220,40,40,0.08);
            border: 1px solid rgba(220,40,40,0.2);
            border-radius: 8px;
            padding: 16px 20px;
            color: #f07070;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* ── Footer ── */
        footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="eyebrow">PDGA · Official Records</div>
        <h1>All Time Greatest<span>Rounds Played</span></h1>
        <div class="header-meta">
            <span>Disc Golf</span>
            <span class="sep"></span>
            <span>Course Records Archive</span>
            <span class="sep"></span>
            <span id="record-count">—</span>
        </div>
    </header>

    <div class="divider"></div>

    <div id="error-msg">⚠ Cannot load records.json — check for formatting errors (missing quotes, trailing commas).</div>

    <div class="controls-row">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('full-bag', this)">Full Bag</button>
            <button class="tab-btn" onclick="switchTab('one-disc', this)">1-Disc</button>
            <button class="tab-btn" onclick="switchTab('doubles', this)">Doubles</button>
        </div>

        <div class="filter-wrapper" id="filter-wrapper">
            <button class="filter-select-btn" id="filter-btn" onclick="toggleDropdown()">
                <span id="filter-btn-label">All Players</span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="filter-dropdown" id="filter-dropdown">
                <!-- populated by JS -->
            </div>
        </div>
    </div>

    <div class="filter-banner" id="filter-banner">
        <div class="filter-banner-info">
            <span>▸</span>
            <span id="filter-banner-text"></span>
        </div>
        <button class="clear-filter-btn" onclick="setFilter(null)">Clear</button>
    </div>

    <div id="full-bag" class="tab-content active"></div>
    <div id="one-disc" class="tab-content"></div>
    <div id="doubles" class="tab-content"></div>

    <footer>Frisbee PDGA · Records Archive</footer>

</div>

<script>
    let allData = null;
    let activePlayer = null;
    let dropdownOpen = false;

    /* ── Tab switching ── */
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    /* ── Dropdown toggle ── */
    function toggleDropdown() {
        dropdownOpen = !dropdownOpen;
        document.getElementById('filter-dropdown').classList.toggle('open', dropdownOpen);
        document.getElementById('filter-btn').classList.toggle('open', dropdownOpen);
    }

    function closeDropdown() {
        dropdownOpen = false;
        document.getElementById('filter-dropdown').classList.remove('open');
        document.getElementById('filter-btn').classList.remove('open');
    }

    document.addEventListener('click', e => {
        if (!document.getElementById('filter-wrapper').contains(e.target)) {
            closeDropdown();
        }
    });

    /* ── Extract all unique players from data ── */
    function extractPlayers(data) {
        const players = new Set();
        ['fullBag', 'oneDisc', 'doubles'].forEach(key => {
            (data[key] || []).forEach(course => {
                course.records.forEach(r => {
                    // For doubles, split "Player A & Player B" into individuals
                    r.player.split('&').forEach(p => players.add(p.trim()));
                });
            });
        });
        return [...players].sort((a, b) => a.localeCompare(b));
    }

    /* ── Build dropdown options ── */
    function buildDropdown(players) {
        const dd = document.getElementById('filter-dropdown');
        dd.innerHTML = `
            <div class="filter-option all-option ${activePlayer === null ? 'selected' : ''}"
                 onclick="setFilter(null)">All Players</div>
            ${players.map(p => `
                <div class="filter-option ${activePlayer === p ? 'selected' : ''}"
                     onclick="setFilter('${p.replace(/'/g, "\\'")}')">
                    ${p}
                </div>
            `).join('')}
        `;
    }

    /* ── Set active player filter ── */
    function setFilter(player) {
        activePlayer = player;
        closeDropdown();

        const btn = document.getElementById('filter-btn');
        const label = document.getElementById('filter-btn-label');
        const banner = document.getElementById('filter-banner');
        const bannerText = document.getElementById('filter-banner-text');

        if (player) {
            label.textContent = player;
            btn.classList.add('has-filter');
            banner.classList.add('visible');
            bannerText.textContent = `Showing records for ${player}`;
        } else {
            label.textContent = 'All Players';
            btn.classList.remove('has-filter');
            banner.classList.remove('visible');
        }

        buildDropdown(extractPlayers(allData));
        renderAll();
    }

    /* ── Build HTML for a tab section ── */
    function buildHTML(dataArray) {
        if (!dataArray || dataArray.length === 0)
            return '<div class="empty-state">No records yet.</div>';

        // If filtering: only show courses where at least one record matches
        let filtered = dataArray;
        if (activePlayer) {
            filtered = dataArray
                .map(course => ({
                    ...course,
                    records: course.records.filter(r =>
                        r.player.split('&').map(p => p.trim()).includes(activePlayer)
                    )
                }))
                .filter(course => course.records.length > 0);
        }

        if (filtered.length === 0)
            return `<div class="empty-state">No records for ${activePlayer}.</div>`;

        return filtered.map(course => `
            <div class="course-card">
                <div class="course-card-header">
                    <div class="course-name">${course.course}</div>
                    <div class="layout-badge">${course.layout}</div>
                </div>
                <div class="leaderboard">
                    ${course.records.map((record, i) => {
                        const isMatch = activePlayer &&
                            record.player.split('&').map(p => p.trim()).includes(activePlayer);
                        return `
                        <div class="record-row${isMatch ? ' highlight-row' : ''}">
                            <div class="rank-col">
                                <div class="rank-num">#${i + 1}</div>
                            </div>
                            <div class="score">${record.score}</div>
                            <div class="player-col">
                                <div class="player-name${isMatch ? ' matched' : ''}">${record.player}</div>
                                ${record.detail ? `<div class="detail-text">${record.detail}</div>` : ''}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `).join('');
    }

    function renderAll() {
        document.getElementById('full-bag').innerHTML = buildHTML(allData.fullBag);
        document.getElementById('one-disc').innerHTML = buildHTML(allData.oneDisc);
        document.getElementById('doubles').innerHTML = buildHTML(allData.doubles);
    }

    /* ── Load records ── */
    async function loadRecords() {
        try {
            const response = await fetch('records.json?v=' + Date.now());
            if (!response.ok) throw new Error('Network response was not ok');
            allData = await response.json();

            const total = [allData.fullBag, allData.oneDisc, allData.doubles]
                .flat()
                .reduce((s, c) => s + (c?.records?.length || 0), 0);
            document.getElementById('record-count').textContent = total + ' records';

            buildDropdown(extractPlayers(allData));
            renderAll();

        } catch (err) {
            console.error('Error loading JSON:', err);
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    loadRecords();
</script>
</body>
</html>
